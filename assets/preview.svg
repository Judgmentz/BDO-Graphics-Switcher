<svg xmlns="http://www.w3.org/2000/svg" width="540" height="560" viewBox="0 0 540 560" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="gold"><stop offset="0" stop-color="#D9B97A" stop-opacity=".38"/><stop offset="1" stop-color="#D9B97A" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple"><stop offset="0" stop-color="#C084FC" stop-opacity=".25"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
    <radialGradient id="green"><stop offset="0" stop-color="#4ADE80" stop-opacity=".16"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F4E3BD"/><stop offset="1" stop-color="#D9B97A"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9B97A" stop-opacity=".55"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#D9B97A" stop-opacity=".35"/></linearGradient>
    <linearGradient id="cardU" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C084FC" stop-opacity=".14"/><stop offset="1" stop-color="#13131A"/></linearGradient>
    <linearGradient id="cardN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ADE80" stop-opacity=".09"/><stop offset="1" stop-color="#13131A"/></linearGradient>
    <linearGradient id="pBar" x1="0" x2="1"><stop offset="0" stop-color="#C084FC" stop-opacity=".6"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <linearGradient id="gBar" x1="0" x2="1"><stop offset="0" stop-color="#4ADE80" stop-opacity=".6"/><stop offset="1" stop-color="#4ADE80"/></linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#C9A462"/><stop offset=".4" stop-color="#C9A462"/><stop offset=".5" stop-color="#FFF6DD"/><stop offset=".6" stop-color="#C9A462"/><stop offset="1" stop-color="#C9A462"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect x="20" y="20" width="500" height="520" rx="22"/></clipPath>
  </defs>

  <rect x="26" y="30" width="488" height="512" rx="22" fill="#000" opacity=".6" filter="url(#shadow)"/>

  <g clip-path="url(#clip)">
    <rect x="20" y="20" width="500" height="520" fill="#0B0B10"/>
    <circle cx="40" cy="20" r="210" fill="url(#gold)"><animate attributeName="cx" values="40;110;40" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="300" r="200" fill="url(#purple)"><animate attributeName="cy" values="300;360;300" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="560" r="200" fill="url(#green)"><animate attributeName="cx" values="80;160;80" dur="12s" repeatCount="indefinite"/></circle>

    <!-- tabs -->
    <g transform="translate(38 32)">
      <rect width="222" height="34" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".1"/>
      <rect x="3" y="3" width="104" height="28" rx="9" fill="#D9B97A" fill-opacity=".2" stroke="#D9B97A" stroke-opacity=".45"/>
      <path d="M44 11 L38 20 H42.5 L40.5 26 L47 17 H42.5 Z" fill="#F4E3BD"/>
      <text x="52" y="21.5" font-size="12" font-weight="600" fill="#F4E3BD">Graphics</text>
      <rect x="128" y="11" width="10" height="11" rx="2" fill="none" stroke="#8A8A96" stroke-width="1.4"/>
      <text x="144" y="21.5" font-size="12" font-weight="600" fill="#8A8A96">Weekly</text>
      <rect x="190" y="9" width="22" height="16" rx="8" fill="#C084FC"/>
      <text x="201" y="21" font-size="10" font-weight="800" fill="#16091F" text-anchor="middle">11</text>
    </g>

    <!-- window buttons -->
    <path d="M454 42 H464" stroke="#8A8A96" stroke-width="1.4"/>
    <path d="M486 37 L496 47 M496 37 L486 47" stroke="#8A8A96" stroke-width="1.4"/>

    <!-- header -->
    <rect x="50" y="88" width="9" height="9" fill="#E8CF9A" transform="rotate(45 54.5 92.5)"/>
    <text x="68" y="97" font-size="11" font-weight="700" fill="#A8936A" letter-spacing="1">BLACK DESERT ONLINE</text>
    <text x="47" y="136" font-size="34" font-weight="800" fill="url(#title)">Graphics Switcher</text>
    <text x="48" y="158" font-size="13" fill="#8A8A96">One-click NVIDIA driver profiles for maximum FPS.</text>

    <g transform="translate(48 172)">
      <rect width="196" height="30" rx="15" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".12"/>
      <circle cx="17" cy="15" r="4.5" fill="#76B900"/>
      <circle cx="17" cy="15" r="4.5" fill="#76B900">
        <animate attributeName="r" values="4.5;11" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <text x="31" y="19.5" font-size="12" font-weight="600" fill="#D6D6DE">NVIDIA GeForce GTX 1660</text>
    </g>

    <!-- Ultra Potato card (active) -->
    <g transform="translate(44 222)">
      <rect x="4" y="6" width="444" height="112" rx="16" fill="#9333EA" filter="url(#blur)" opacity=".4">
        <animate attributeName="opacity" values=".25;.6;.25" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect width="452" height="122" rx="16" fill="#13131A"/>
      <rect width="452" height="122" rx="16" fill="url(#cardU)" stroke="#C084FC" stroke-opacity=".8"/>
      <rect x="16" y="16" width="52" height="52" rx="14" fill="#C084FC" fill-opacity=".13" stroke="#C084FC" stroke-opacity=".32"/>
      <path d="M46 25 L33 45 H42 L38.5 60 L52.5 38 H43.5 Z" fill="#C084FC"/>
      <text x="82" y="34" font-size="15" font-weight="800" fill="#FFFFFF">ULTRA POTATO</text>
      <g transform="translate(212 20)">
        <rect width="66" height="20" rx="10" fill="#C084FC" fill-opacity=".18" stroke="#C084FC" stroke-opacity=".4"/>
        <text x="33" y="14" font-size="9.5" font-weight="800" fill="#C084FC" text-anchor="middle">✓ ACTIVE</text>
      </g>
      <text x="82" y="53" font-size="12" fill="#8A8A96">Every driver setting tuned for FPS</text>
      <text x="82" y="81" font-size="9.5" font-weight="600" fill="#6E6E7A">PERFORMANCE</text>
      <rect x="168" y="75" width="214" height="5" rx="2.5" fill="#22222B"/>
      <rect x="168" y="75" width="214" height="5" rx="2.5" fill="url(#pBar)"><animate attributeName="width" values="0;214" dur="1.4s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/></rect>
      <text x="410" y="81" font-size="10" font-weight="600" fill="#9A9AA6" text-anchor="end">100%</text>
      <text x="82" y="100" font-size="9.5" font-weight="600" fill="#6E6E7A">QUALITY</text>
      <rect x="168" y="94" width="214" height="5" rx="2.5" fill="#22222B"/>
      <rect x="168" y="94" width="11" height="5" rx="2.5" fill="url(#pBar)"><animate attributeName="width" values="0;11" dur="1.4s" begin=".42s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/></rect>
      <text x="410" y="100" font-size="10" font-weight="600" fill="#9A9AA6" text-anchor="end">5%</text>
      <path d="M428 55 L434 61 L428 67" stroke="#C084FC" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Normal card -->
    <g transform="translate(44 356)">
      <rect width="452" height="122" rx="16" fill="#13131A"/>
      <rect width="452" height="122" rx="16" fill="url(#cardN)" stroke="#26262E"/>
      <rect x="16" y="16" width="52" height="52" rx="14" fill="#4ADE80" fill-opacity=".13" stroke="#4ADE80" stroke-opacity=".32"/>
      <path d="M42 27 L46 37 L56.5 37.7 L48.5 44.5 L51 54.8 L42 49.2 L33 54.8 L35.5 44.5 L27.5 37.7 L38 37 Z" fill="#4ADE80"/>
      <text x="82" y="34" font-size="15" font-weight="800" fill="#FFFFFF">NORMAL</text>
      <text x="82" y="53" font-size="12" fill="#8A8A96">Driver defaults  ·  full quality</text>
      <text x="82" y="81" font-size="9.5" font-weight="600" fill="#6E6E7A">PERFORMANCE</text>
      <rect x="168" y="75" width="214" height="5" rx="2.5" fill="#22222B"/>
      <rect x="168" y="75" width="86" height="5" rx="2.5" fill="url(#gBar)"><animate attributeName="width" values="0;86" dur="1.4s" begin=".55s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/></rect>
      <text x="410" y="81" font-size="10" font-weight="600" fill="#9A9AA6" text-anchor="end">40%</text>
      <text x="82" y="100" font-size="9.5" font-weight="600" fill="#6E6E7A">QUALITY</text>
      <rect x="168" y="94" width="214" height="5" rx="2.5" fill="#22222B"/>
      <rect x="168" y="94" width="214" height="5" rx="2.5" fill="url(#gBar)"><animate attributeName="width" values="0;214" dur="1.4s" begin=".67s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/></rect>
      <text x="410" y="100" font-size="10" font-weight="600" fill="#9A9AA6" text-anchor="end">100%</text>
      <path d="M428 55 L434 61 L428 67" stroke="#6E6E7A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- footer -->
    <rect x="48" y="496" width="444" height="1" fill="#FFFFFF" fill-opacity=".1"/>
    <text x="48" y="522" font-size="12" fill="#5E5E6A">Crafted by <tspan font-weight="800" font-size="12.5" fill="url(#name)">Judgmentz</tspan></text>
    <text x="492" y="522" font-size="11" fill="#5E5E6A" text-anchor="end">v1.4.1</text>
  </g>

  <rect x="20.75" y="20.75" width="498.5" height="518.5" rx="21.5" fill="none" stroke="url(#frame)" stroke-width="1.5"/>
</svg>
