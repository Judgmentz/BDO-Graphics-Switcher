<svg xmlns="http://www.w3.org/2000/svg" width="540" height="560" viewBox="0 0 540 560" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="gold"><stop offset="0" stop-color="#D9B97A" stop-opacity=".34"/><stop offset="1" stop-color="#D9B97A" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple"><stop offset="0" stop-color="#C084FC" stop-opacity=".2"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F4E3BD"/><stop offset="1" stop-color="#D9B97A"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9B97A" stop-opacity=".55"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#D9B97A" stop-opacity=".35"/></linearGradient>
    <linearGradient id="chkGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4E3BD"/><stop offset="1" stop-color="#D9B97A"/></linearGradient>
    <linearGradient id="chkRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB3B5"/><stop offset="1" stop-color="#FF6B6F"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect x="20" y="20" width="500" height="520" rx="22"/></clipPath>
    <!-- reusable pills -->
    <g id="thu">
      <rect width="104" height="18" rx="7" fill="#D9B97A" fill-opacity=".13" stroke="#D9B97A" stroke-opacity=".4"/>
      <circle cx="11" cy="9" r="3.6" fill="none" stroke="#D9B97A" stroke-width="1.2"/><path d="M11 7 V9 H12.6" stroke="#D9B97A" stroke-width="1.1" fill="none"/>
      <text x="19" y="12.8" font-size="9.5" font-weight="800" fill="#D9B97A">THU</text>
      <text x="42" y="12.8" font-size="9.5" font-weight="600" fill="#F4E3BD">4d 16h 37m</text>
    </g>
    <g id="sun">
      <rect width="108" height="18" rx="7" fill="#FFA94D" fill-opacity=".13" stroke="#FFA94D" stroke-opacity=".4"/>
      <circle cx="11" cy="9" r="3.6" fill="none" stroke="#FFA94D" stroke-width="1.2"/><path d="M11 7 V9 H12.6" stroke="#FFA94D" stroke-width="1.1" fill="none"/>
      <text x="19" y="12.8" font-size="9.5" font-weight="800" fill="#FFA94D">SUN</text>
      <text x="42" y="12.8" font-size="9.5" font-weight="600" fill="#FFD3A6">16h 37m 12s</text>
    </g>
  </defs>

  <rect x="26" y="30" width="488" height="512" rx="22" fill="#000" opacity=".6" filter="url(#shadow)"/>

  <g clip-path="url(#clip)">
    <rect x="20" y="20" width="500" height="520" fill="#0B0B10"/>
    <circle cx="40" cy="20" r="210" fill="url(#gold)"><animate attributeName="cx" values="40;110;40" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="420" r="210" fill="url(#purple)"><animate attributeName="cy" values="420;360;420" dur="9s" repeatCount="indefinite"/></circle>

    <!-- tabs -->
    <g transform="translate(38 32)">
      <rect width="222" height="34" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".1"/>
      <rect x="115" y="3" width="104" height="28" rx="9" fill="#D9B97A" fill-opacity=".2" stroke="#D9B97A" stroke-opacity=".45"/>
      <path d="M24 11 L18 20 H22.5 L20.5 26 L27 17 H22.5 Z" fill="#8A8A96"/>
      <text x="32" y="21.5" font-size="12" font-weight="600" fill="#8A8A96">Graphics</text>
      <rect x="128" y="11" width="10" height="11" rx="2" fill="none" stroke="#F4E3BD" stroke-width="1.4"/>
      <text x="144" y="21.5" font-size="12" font-weight="600" fill="#F4E3BD">Weekly</text>
      <rect x="190" y="9" width="22" height="16" rx="8" fill="#C084FC"/>
      <text x="201" y="21" font-size="10" font-weight="800" fill="#16091F" text-anchor="middle">7</text>
    </g>
    <path d="M454 42 H464" stroke="#8A8A96" stroke-width="1.4"/>
    <path d="M486 37 L496 47 M496 37 L486 47" stroke="#8A8A96" stroke-width="1.4"/>

    <!-- header -->
    <text x="48" y="97" font-size="11" font-weight="700" fill="#A8936A" letter-spacing="1">BLACK DESERT ONLINE  ·  EU</text>
    <text x="47" y="136" font-size="34" font-weight="800" fill="url(#title)">Weekly Checklist</text>
    <text x="48" y="168" font-size="12" font-weight="800" fill="#FFFFFF">4/11<tspan font-weight="400" fill="#8A8A96">  completed</tspan></text>
    <rect x="370" y="154" width="64" height="24" rx="9" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".11"/>
    <text x="402" y="170" font-size="11" font-weight="600" fill="#A0A0AC" text-anchor="middle">Reset all</text>
    <rect x="440" y="154" width="56" height="24" rx="9" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".11"/>
    <text x="468" y="170" font-size="11" font-weight="600" fill="#A0A0AC" text-anchor="middle">Edit list</text>

    <!-- section: world bosses -->
    <g transform="translate(46 196)">
      <rect width="22" height="22" rx="7" fill="#D9B97A" fill-opacity=".16"/>
      <path d="M8 6 V16 M8 6 H15 L13 9 L15 12 H8" stroke="#D9B97A" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
      <text x="31" y="15.5" font-size="11" font-weight="800" fill="#D9B97A">WORLD BOSSES</text>
      <text x="448" y="15.5" font-size="11" font-weight="600" fill="#6E6E7A" text-anchor="end">1/3</text>
    </g>

    <!-- row: Garmoth (2/3) -->
    <g transform="translate(44 228)">
      <rect width="452" height="52" rx="12" fill="#12121A" stroke="#20202A"/>
      <circle cx="23" cy="26" r="10.5" fill="none" stroke="#3A3A46" stroke-width="1.6"/>
      <text x="46" y="23" font-size="13" font-weight="700" fill="#FFFFFF">Garmoth</text>
      <use href="#thu" x="110" y="10"/>
      <text x="46" y="40" font-size="11" fill="#6E6E7A">Loot 3 times a week</text>
      <circle cx="410" cy="26" r="4" fill="#D9B97A"/><circle cx="421" cy="26" r="4" fill="#D9B97A"/><circle cx="432" cy="26" r="4" fill="#2A2A35"/>
    </g>

    <!-- row: Morning Light bosses (done) -->
    <g transform="translate(44 286)">
      <rect width="452" height="52" rx="12" fill="#12121A" stroke="#20202A"/>
      <circle cx="23" cy="26" r="11" fill="url(#chkGold)">
        <animate attributeName="r" values="0;13;11" dur=".7s" begin=".4s" fill="freeze"/>
      </circle>
      <path d="M18 26 L21.5 29.5 L28 22.5" stroke="#121218" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g opacity=".42">
        <text x="46" y="23" font-size="13" font-weight="700" fill="#FFFFFF">Morning Light bosses</text>
        <rect x="46" y="18" width="133" height="1.2" fill="#FFFFFF"/>
        <text x="46" y="40" font-size="11" fill="#6E6E7A">Land of the Morning Light · one reward per boss</text>
      </g>
      <use href="#thu" x="200" y="10" opacity=".45"/>
      <circle cx="399" cy="26" r="4" fill="#D9B97A"/><circle cx="410" cy="26" r="4" fill="#D9B97A"/><circle cx="421" cy="26" r="4" fill="#D9B97A"/><circle cx="432" cy="26" r="4" fill="#D9B97A"/>
    </g>

    <!-- section: dungeons -->
    <g transform="translate(46 356)">
      <rect width="22" height="22" rx="7" fill="#FF6B6F" fill-opacity=".16"/>
      <circle cx="11" cy="10" r="3.4" fill="none" stroke="#FF6B6F" stroke-width="1.4"/><path d="M11 13.5 V17" stroke="#FF6B6F" stroke-width="1.4"/>
      <text x="31" y="15.5" font-size="11" font-weight="800" fill="#FF6B6F">DUNGEONS &amp; SHRINES</text>
      <text x="448" y="15.5" font-size="11" font-weight="600" fill="#6E6E7A" text-anchor="end">1/3</text>
    </g>

    <!-- row: Pit (done) -->
    <g transform="translate(44 388)">
      <rect width="452" height="52" rx="12" fill="#12121A" stroke="#20202A"/>
      <circle cx="23" cy="26" r="11" fill="url(#chkRed)"/>
      <path d="M18 26 L21.5 29.5 L28 22.5" stroke="#121218" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g opacity=".42">
        <text x="46" y="23" font-size="13" font-weight="700" fill="#FFFFFF">Pit of the Undying</text>
        <rect x="46" y="18" width="112" height="1.2" fill="#FFFFFF"/>
        <text x="46" y="40" font-size="11" fill="#6E6E7A">Only once a week</text>
      </g>
      <use href="#thu" x="178" y="10" opacity=".45"/>
    </g>

    <!-- row: Black Shrine (Sunday) -->
    <g transform="translate(44 446)">
      <rect width="452" height="52" rx="12" fill="#12121A" stroke="#20202A"/>
      <circle cx="23" cy="26" r="10.5" fill="none" stroke="#3A3A46" stroke-width="1.6"/>
      <text x="46" y="23" font-size="13" font-weight="700" fill="#FFFFFF">Black Shrine</text>
      <use href="#sun" x="136" y="10"/>
      <text x="46" y="40" font-size="11" fill="#6E6E7A">Boss Blitz · 5 attempts per family</text>
      <circle cx="388" cy="26" r="4" fill="#FF6B6F"/><circle cx="399" cy="26" r="4" fill="#FF6B6F"/><circle cx="410" cy="26" r="4" fill="#2A2A35"/><circle cx="421" cy="26" r="4" fill="#2A2A35"/><circle cx="432" cy="26" r="4" fill="#2A2A35"/>
    </g>

    <rect x="20" y="500" width="500" height="40" fill="#0B0B10" opacity=".85"/>
    <text x="48" y="524" font-size="12" fill="#5E5E6A">Crafted by <tspan font-weight="800" font-size="12.5" fill="#E8CF9A">Judgmentz</tspan></text>
    <text x="492" y="524" font-size="11" fill="#5E5E6A" text-anchor="end">v1.4.1</text>
  </g>

  <rect x="20.75" y="20.75" width="498.5" height="518.5" rx="21.5" fill="none" stroke="url(#frame)" stroke-width="1.5"/>
</svg>
