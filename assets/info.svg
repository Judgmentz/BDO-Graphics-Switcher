<svg xmlns="http://www.w3.org/2000/svg" width="760" height="76" viewBox="0 0 760 76" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17161E"/><stop offset="1" stop-color="#0F0F14"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7E6BC"/><stop offset="1" stop-color="#C9A462"/></linearGradient>
    <clipPath id="clip"><rect x="2" y="6" width="756" height="64" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- 1 · Release -->
    <g>
      <animate attributeName="opacity" values="0;1" dur=".5s" begin=".05s" fill="freeze"/>
      <rect x="2.5" y="6.5" width="181" height="63" rx="17.5" fill="url(#bg)" stroke="#D9B97A" stroke-opacity=".35"/>
      <circle cx="34" cy="38" r="16" fill="#D9B97A" fill-opacity=".14"/>
      <rect x="28.5" y="32.5" width="11" height="11" rx="1.5" fill="url(#gold)" transform="rotate(45 34 38)"/>
      <text x="60" y="31" font-size="10" font-weight="700" letter-spacing="2" fill="#8A7A5A">RELEASE</text>
      <text x="60" y="52" font-size="17" font-weight="800" fill="#F4E3BD">v1.6.0</text>
    </g>

    <!-- 2 · Windows -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;.3;1" dur=".7s" begin=".05s" fill="freeze"/>
      <rect x="194.5" y="6.5" width="181" height="63" rx="17.5" fill="url(#bg)" stroke="#60A5FA" stroke-opacity=".3"/>
      <circle cx="226" cy="38" r="16" fill="#60A5FA" fill-opacity=".13"/>
      <g fill="#93C5FD">
        <rect x="218.5" y="30.5" width="7" height="7" rx="1"/><rect x="226.5" y="30.5" width="7" height="7" rx="1"/>
        <rect x="218.5" y="38.5" width="7" height="7" rx="1"/><rect x="226.5" y="38.5" width="7" height="7" rx="1"/>
      </g>
      <text x="252" y="31" font-size="10" font-weight="700" letter-spacing="2" fill="#6B7C99">PLATFORM</text>
      <text x="252" y="52" font-size="17" font-weight="800" fill="#FFFFFF">Win 10 · 11</text>
    </g>

    <!-- 3 · NVIDIA -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;.45;1" dur=".9s" begin=".05s" fill="freeze"/>
      <rect x="386.5" y="6.5" width="181" height="63" rx="17.5" fill="url(#bg)" stroke="#76B900" stroke-opacity=".35"/>
      <circle cx="418" cy="38" r="16" fill="#76B900" fill-opacity=".14"/>
      <rect x="411" y="31" width="14" height="14" rx="3" fill="none" stroke="#9BE22D" stroke-width="2"/>
      <rect x="415" y="35" width="6" height="6" rx="1" fill="#9BE22D"/>
      <g stroke="#9BE22D" stroke-width="1.6" stroke-linecap="round">
        <path d="M415 28 V30 M421 28 V30 M415 46 V48 M421 46 V48 M408 35 H410 M408 41 H410 M426 35 H428 M426 41 H428"/>
      </g>
      <circle cx="430" cy="27" r="3" fill="#9BE22D">
        <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="444" y="31" font-size="10" font-weight="700" letter-spacing="2" fill="#6F8A4A">GPU</text>
      <text x="444" y="52" font-size="17" font-weight="800" fill="#FFFFFF">NVIDIA only</text>
    </g>

    <!-- 4 · Size -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;.55;1" dur="1.1s" begin=".05s" fill="freeze"/>
      <rect x="578.5" y="6.5" width="179" height="63" rx="17.5" fill="url(#bg)" stroke="#C084FC" stroke-opacity=".35"/>
      <circle cx="610" cy="38" r="16" fill="#C084FC" fill-opacity=".14"/>
      <g stroke="#D8B4FE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M610 30 V42"/><path d="M605 37.5 L610 42.5 L615 37.5"/><path d="M603.5 46 H616.5"/>
        <animateTransform attributeName="transform" type="translate" values="0 -1;0 1.5;0 -1" dur="1.4s" repeatCount="indefinite"/>
      </g>
      <text x="636" y="31" font-size="10" font-weight="700" letter-spacing="2" fill="#86709F">SIZE</text>
      <text x="636" y="52" font-size="17" font-weight="800" fill="#FFFFFF">490 KB</text>
    </g>

    <!-- shimmer sweep -->
    <rect x="-200" y="0" width="160" height="76" fill="url(#shine)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;1150 0" keyTimes="0;.5;1" dur="4.5s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>
</svg>
