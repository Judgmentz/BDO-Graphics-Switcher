<svg xmlns="http://www.w3.org/2000/svg" width="440" height="104" viewBox="0 0 440 104" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E6BC"/><stop offset=".55" stop-color="#E2C285"/><stop offset="1" stop-color="#B98F4C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="clip"><rect x="12" y="14" width="416" height="76" rx="22"/></clipPath>
  </defs>

  <rect x="22" y="22" width="396" height="64" rx="22" fill="#D9B97A" filter="url(#glow)" opacity=".55">
    <animate attributeName="opacity" values=".35;.75;.35" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="12" y="14" width="416" height="76" rx="22" fill="url(#btn)"/>

  <g clip-path="url(#clip)">
    <rect x="-140" y="0" width="110" height="104" fill="url(#shine)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 640 0" keyTimes="0;.45;1" dur="3.2s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <circle cx="58" cy="52" r="24" fill="#1A1408" fill-opacity=".9"/>
  <g stroke="#F2DDA8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M58 40 V58"/>
    <path d="M50 51 L58 59 L66 51"/>
    <path d="M48 64 H68"/>
    <animateTransform attributeName="transform" type="translate" values="0 -1;0 2;0 -1" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <text x="96" y="50" font-size="24" font-weight="800" fill="#1A1408">Download for Windows</text>
  <text x="97" y="72" font-size="13.5" font-weight="600" fill="#5A4524">BDO_Potato_Lab.exe  ·  latest release  ·  no install</text>
</svg>
