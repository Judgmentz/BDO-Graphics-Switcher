  <rect x="62" y="62" width="132" height="132" rx="18" fill="url(#gold)" transform="rotate(45 128 128)"/>
  <rect x="62" y="62" width="132" height="132" rx="18" fill="none" stroke="#FFF6DD" stroke-opacity=".55" stroke-width="3" transform="rotate(45 128 128)"/>
