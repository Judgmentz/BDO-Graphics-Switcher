<svg xmlns="http://www.w3.org/2000/svg" width="760" height="76" viewBox="0 0 760 76" font-family="'Segoe UI Variable Display', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2C2E"/><stop offset="1" stop-color="#1C1C1E"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="2" y="6" width="756" height="64" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Release -->
    <g>
      <animate attributeName="opacity" values="0;1" dur=".5s" begin=".05s" fill="freeze"/>
      <rect x="2.5" y="6.5" width="181" height="63" rx="21.5" fill="url(#bg)" stroke="url(#rim)"/>
      <circle cx="34" cy="38" r="16" fill="#FFFFFF" fill-opacity=".1"/>
      <path d="M34 29 L40 38 L34 47 L28 38 Z" fill="#F5F5F7"/>
      <text x="60" y="31" font-size="11.5" fill="#AEAEB2">Release</text>
      <text x="60" y="52" font-size="17" font-weight="600" fill="#F5F5F7">v1.7.1</text>
    </g>

    <!-- Windows -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;.3;1" dur=".7s" begin=".05s" fill="freeze"/>
      <rect x="194.5" y="6.5" width="181" height="63" rx="21.5" fill="url(#bg)" stroke="url(#rim)"/>
      <circle cx="226" cy="38" r="16" fill="#FFFFFF" fill-opacity=".1"/>
      <g fill="#E5E5EA">
        <rect x="218.5" y="30.5" width="7" height="7" rx="1"/><rect x="226.5" y="30.5" width="7" height="7" rx="1"/>
        <rect x="218.5" y="38.5" width="7" height="7" rx="1"/><rect x="226.5" y="38.5" width="7" height="7" rx="1"/>
      </g>
      <text x="252" y="31" font-size="11.5" fill="#AEAEB2">Platform</text>
      <text x="252" y="52" font-size="17" font-weight="600" fill="#F5F5F7">Windows 10, 11</text>
    </g>

    <!-- NVIDIA -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;.45;1" dur=".9s" begin=".05s" fill="freeze"/>
      <rect x="386.5" y="6.5" width="181" height="63" rx="21.5" fill="url(#bg)" stroke="url(#rim)"/>
      <circle cx="418" cy="38" r="16" fill="#FFFFFF" fill-opacity=".1"/>
      <rect x="411" y="31" width="14" height="14" rx="3" fill="none" stroke="#E5E5EA" stroke-width="2"/>
      <rect x="415" y="35" width="6" height="6" rx="1" fill="#E5E5EA"/>
      <g stroke="#E5E5EA" stroke-width="1.6" stroke-linecap="round">
        <path d="M415 28 V30 M421 28 V30 M415 46 V48 M421 46 V48 M408 35 H410 M408 41 H410 M426 35 H428 M426 41 H428"/>
      </g>
      <text x="444" y="31" font-size="11.5" fill="#AEAEB2">GPU</text>
      <text x="444" y="52" font-size="17" font-weight="600" fill="#F5F5F7">NVIDIA only</text>
    </g>

    <!-- Size -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;.55;1" dur="1.1s" begin=".05s" fill="freeze"/>
      <rect x="578.5" y="6.5" width="179" height="63" rx="21.5" fill="url(#bg)" stroke="url(#rim)"/>
      <circle cx="610" cy="38" r="16" fill="#FFFFFF" fill-opacity=".1"/>
      <g stroke="#E5E5EA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M610 30 V42"/><path d="M605 37.5 L610 42.5 L615 37.5"/><path d="M603.5 46 H616.5"/>
        <animateTransform attributeName="transform" type="translate" values="0 -1;0 1.5;0 -1" dur="1.4s" repeatCount="indefinite"/>
      </g>
      <text x="636" y="31" font-size="11.5" fill="#AEAEB2">Size</text>
      <text x="636" y="52" font-size="17" font-weight="600" fill="#F5F5F7">493 KB</text>
    </g>

    <rect x="-200" y="0" width="160" height="76" fill="url(#shine)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;1150 0" keyTimes="0;.5;1" dur="4.5s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>
</svg>
