<svg xmlns="http://www.w3.org/2000/svg" width="540" height="600" viewBox="0 0 540 600" font-family="'Segoe UI Variable Display', 'Segoe UI', -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C1E"/><stop offset=".45" stop-color="#232326"/><stop offset=".8" stop-color="#2C2C2E"/><stop offset="1" stop-color="#1A1A1C"/>
    </linearGradient>
    <radialGradient id="orb"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".15"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/></linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".3"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/></linearGradient>
    <linearGradient id="tileU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D8D8DC"/></linearGradient>
    <linearGradient id="tileN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ABABB0"/><stop offset="1" stop-color="#7D7D82"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="clip"><rect x="20" y="20" width="500" height="560" rx="30"/></clipPath>
  </defs>

  <rect x="28" y="32" width="484" height="552" rx="30" fill="#000" opacity=".55" filter="url(#shadow)"/>

  <g clip-path="url(#clip)">
    <rect x="20" y="20" width="500" height="560" fill="url(#sky)"/>
    <circle cx="90" cy="60" r="220" fill="url(#orb)"><animate attributeName="cx" values="90;160;90" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="420" r="210" fill="url(#orb)" opacity=".7"><animate attributeName="cy" values="420;370;420" dur="9s" repeatCount="indefinite"/></circle>

    <!-- window buttons -->
    <path d="M458 44 H468" stroke="#AEAEB2" stroke-width="1.4"/>
    <path d="M488 39 L498 49 M498 39 L488 49" stroke="#AEAEB2" stroke-width="1.4"/>

    <!-- header -->
    <text x="48" y="112" font-size="36" font-weight="600" fill="#F5F5F7" letter-spacing="-.5">Potato Lab</text>
    <text x="49" y="138" font-size="13.5" fill="#AEAEB2">One-click NVIDIA driver profiles for maximum FPS.</text>

    <g transform="translate(48 156)">
      <rect width="200" height="30" rx="15" fill="url(#glass)" stroke="url(#rim)"/>
      <circle cx="17" cy="15" r="4" fill="#F5F5F7"/>
      <circle cx="17" cy="15" r="4" fill="#F5F5F7">
        <animate attributeName="r" values="4;10" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="19.5" font-size="12" font-weight="600" fill="#E5E5EA">NVIDIA GeForce GTX 1660</text>
    </g>

    <!-- grouped glass list -->
    <g transform="translate(44 210)">
      <rect x="2" y="8" width="448" height="140" rx="22" fill="#000" opacity=".35" filter="url(#soft)"/>
      <rect width="452" height="140" rx="22" fill="url(#glass)" stroke="url(#rim)"/>

      <!-- Ultra Potato (active) -->
      <g>
        <animate attributeName="opacity" values="0;1" dur=".5s" begin=".2s" fill="freeze"/>
        <rect x="1" y="1" width="450" height="69" rx="21" fill="#FFFFFF" fill-opacity=".05"/>
        <rect x="16" y="18" width="34" height="34" rx="9" fill="url(#tileU)"/>
        <path d="M35.5 23 L26 37 H32 L29.5 47 L39.5 32 H33.5 Z" fill="#1C1C1E"/>
        <text x="66" y="33" font-size="15.5" font-weight="600" fill="#F5F5F7">Ultra Potato</text>
        <text x="66" y="52" font-size="12.5" fill="#AEAEB2">Every driver setting tuned for FPS</text>
        <g transform="translate(423 35)">
          <g>
            <animateTransform attributeName="transform" type="scale" values="0;1.15;1" keyTimes="0;.7;1" dur=".55s" begin=".5s" fill="freeze"/>
            <circle r="12" fill="#F5F5F7"/>
            <path d="M-5 0.5 L-1.5 4 L5 -3.5" stroke="#1C1C1E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>
      </g>

      <rect x="66" y="70" width="386" height="1" fill="#FFFFFF" fill-opacity=".11"/>

      <!-- Normal -->
      <g>
        <animate attributeName="opacity" values="0;1" dur=".5s" begin=".32s" fill="freeze"/>
        <rect x="16" y="88" width="34" height="34" rx="9" fill="url(#tileN)"/>
        <path d="M33 94 L36 101.5 L44 102 L38 107 L40 115 L33 110.5 L26 115 L28 107 L22 102 L30 101.5 Z" fill="#FFFFFF"/>
        <text x="66" y="103" font-size="15.5" font-weight="600" fill="#F5F5F7">Normal</text>
        <text x="66" y="122" font-size="12.5" fill="#AEAEB2">Driver defaults, full quality</text>
        <path d="M420 99 L426 105 L420 111" stroke="#6E6E73" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- floating glass tab bar with the liquid thumb -->
    <g transform="translate(128 452)">
      <rect x="4" y="10" width="276" height="58" rx="29" fill="#000" opacity=".4" filter="url(#soft)"/>
      <rect width="284" height="62" rx="31" fill="url(#glass)" stroke="url(#rim)"/>
      <rect x="6" y="6" width="88" height="50" rx="25" fill="url(#thumb)" stroke="#FFFFFF" stroke-opacity=".35">
        <animate attributeName="x" values="6;6;6;98;98;98;190;190;190;6;6" keyTimes="0;.18;.2;.27;.45;.47;.54;.72;.74;.81;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="width" values="88;88;180;88;88;180;88;88;180;88;88" keyTimes="0;.18;.2;.27;.45;.47;.54;.72;.74;.81;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <!-- Graphics -->
      <path d="M53 14 L45 26 H50.5 L48.5 34 L56.5 22 H51 Z" fill="#F5F5F7"/>
      <text x="50" y="48" font-size="10.5" fill="#F5F5F7" text-anchor="middle">Graphics</text>
      <!-- Weekly -->
      <rect x="135" y="15" width="14" height="17" rx="3" fill="none" stroke="#AEAEB2" stroke-width="1.5"/>
      <path d="M139 22 L141 24.5 L145.5 19.5" stroke="#AEAEB2" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="142" y="48" font-size="10.5" fill="#AEAEB2" text-anchor="middle">Weekly</text>
      <rect x="152" y="8" width="20" height="16" rx="8" fill="#F5F5F7"/>
      <text x="162" y="20" font-size="10" font-weight="700" fill="#1C1C1E" text-anchor="middle">11</text>
      <!-- Translation -->
      <circle cx="234" cy="23" r="8.5" fill="none" stroke="#AEAEB2" stroke-width="1.5"/>
      <ellipse cx="234" cy="23" rx="3.8" ry="8.5" fill="none" stroke="#AEAEB2" stroke-width="1.3"/>
      <path d="M225.5 23 H242.5" stroke="#AEAEB2" stroke-width="1.3"/>
      <text x="234" y="48" font-size="10.5" fill="#AEAEB2" text-anchor="middle">Translation</text>
    </g>

    <!-- credits -->
    <text x="48" y="556" font-size="12" fill="#6E6E73">Crafted by <tspan font-weight="700" fill="#F5F5F7">Judgmentz</tspan></text>
    <text x="492" y="556" font-size="11" fill="#6E6E73" text-anchor="end">v1.7.0</text>
  </g>

  <rect x="20.75" y="20.75" width="498.5" height="558.5" rx="29.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
</svg>
