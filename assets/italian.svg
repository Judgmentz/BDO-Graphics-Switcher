<svg xmlns="http://www.w3.org/2000/svg" width="540" height="560" viewBox="0 0 540 560" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="gold"><stop offset="0" stop-color="#D9B97A" stop-opacity=".34"/><stop offset="1" stop-color="#D9B97A" stop-opacity="0"/></radialGradient>
    <radialGradient id="green"><stop offset="0" stop-color="#4ADE80" stop-opacity=".18"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F4E3BD"/><stop offset="1" stop-color="#D9B97A"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9B97A" stop-opacity=".55"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#D9B97A" stop-opacity=".35"/></linearGradient>
    <linearGradient id="flag" x1="0" x2="1">
      <stop offset="0" stop-color="#009246"/><stop offset=".333" stop-color="#009246"/>
      <stop offset=".333" stop-color="#F4F5F0"/><stop offset=".667" stop-color="#F4F5F0"/>
      <stop offset=".667" stop-color="#CE2B37"/><stop offset="1" stop-color="#CE2B37"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#009246"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CE2B37"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect x="20" y="20" width="500" height="520" rx="22"/></clipPath>
  </defs>

  <rect x="26" y="30" width="488" height="512" rx="22" fill="#000" opacity=".6" filter="url(#shadow)"/>

  <g clip-path="url(#clip)">
    <rect x="20" y="20" width="500" height="520" fill="#0B0B10"/>
    <circle cx="40" cy="20" r="210" fill="url(#gold)"><animate attributeName="cx" values="40;110;40" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="300" r="200" fill="url(#green)"><animate attributeName="cy" values="300;360;300" dur="9s" repeatCount="indefinite"/></circle>

    <!-- tabs: Italian active -->
    <g transform="translate(38 32)">
      <rect width="340" height="34" rx="12" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".1"/>
      <rect x="211" y="3" width="126" height="28" rx="9" fill="#D9B97A" fill-opacity=".2" stroke="#D9B97A" stroke-opacity=".45"/>
      <text x="32" y="21.5" font-size="12" font-weight="600" fill="#8A8A96">Graphics</text>
      <text x="136" y="21.5" font-size="12" font-weight="600" fill="#8A8A96">Weekly</text>
      <circle cx="234" cy="17" r="5.5" fill="none" stroke="#F4E3BD" stroke-width="1.3"/>
      <path d="M228.5 17 H239.5 M234 11.5 C231 14 231 20 234 22.5 M234 11.5 C237 14 237 20 234 22.5" stroke="#F4E3BD" stroke-width="1" fill="none"/>
      <text x="247" y="21.5" font-size="12" font-weight="600" fill="#F4E3BD">Translation</text>
    </g>
    <path d="M454 42 H464" stroke="#8A8A96" stroke-width="1.4"/>
    <path d="M486 37 L496 47 M496 37 L486 47" stroke="#8A8A96" stroke-width="1.4"/>

    <!-- header -->
    <text x="48" y="97" font-size="11" font-weight="700" fill="#A8936A" letter-spacing="1">COMMUNITY TRANSLATION  ·  YOUR CUSTOM ITALIAN</text>
    <text x="47" y="136" font-size="34" font-weight="800" fill="url(#title)">Play in Italian</text>

    <!-- sub tabs -->
    <g transform="translate(48 152)">
      <rect width="300" height="30" rx="10" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".1"/>
      <rect x="3" y="3" width="96" height="24" rx="8" fill="#D9B97A" fill-opacity=".2" stroke="#D9B97A" stroke-opacity=".45"/>
      <text x="51" y="19.5" font-size="11.5" font-weight="600" fill="#F4E3BD" text-anchor="middle">Install</text>
      <text x="150" y="19.5" font-size="11.5" font-weight="600" fill="#8A8A96" text-anchor="middle">Glossary</text>
      <text x="249" y="19.5" font-size="11.5" font-weight="600" fill="#8A8A96" text-anchor="middle">Line editor</text>
    </g>

    <!-- edition card -->
    <g transform="translate(44 198)">
      <rect width="452" height="78" rx="14" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".1"/>
      <rect x="14" y="14" width="44" height="44" rx="13" fill="url(#flag)"/>
      <text x="36" y="41" font-size="13" font-weight="900" fill="#1A1225" text-anchor="middle">IT</text>
      <text x="72" y="34" font-size="15" font-weight="800" fill="#FFFFFF">Judgmentz Edition</text>
      <text x="72" y="54" font-size="11.5" fill="#8A8A96">Based on <tspan fill="#E8CF9A" font-weight="600">BDO-Italia by lele344</tspan> (base translation)</text>
    </g>

    <!-- status card -->
    <g transform="translate(44 288)">
      <rect width="452" height="66" rx="14" fill="#FFFFFF" fill-opacity=".05" stroke="#4ADE80" stroke-opacity=".4"/>
      <circle cx="33" cy="33" r="19" fill="#4ADE80" fill-opacity=".18"/>
      <circle cx="33" cy="33" r="19" fill="#4ADE80" fill-opacity=".25">
        <animate attributeName="r" values="19;26" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <path d="M25 33 L30.5 38.5 L41 28" stroke="#4ADE80" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="29" font-size="14" font-weight="800" fill="#FFFFFF">Italian is active</text>
      <text x="64" y="48" font-size="11.5" fill="#8A8A96">Up to date · new game lines filled in · keep the game on English</text>
    </g>

    <!-- install steps -->
    <g transform="translate(48 452)" font-size="11.5">
      <path d="M2 6 L5.5 9.5 L12 2.5" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="20" y="10" fill="#B8F5CB">Downloading translation</text>
      <path d="M232 6 L235.5 9.5 L242 2.5" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="250" y="10" fill="#B8F5CB">Adding new game lines</text>
      <rect x="0" y="22" width="444" height="4" rx="2" fill="#FFFFFF" fill-opacity=".12"/>
      <rect x="0" y="22" width="444" height="4" rx="2" fill="url(#bar)">
        <animate attributeName="width" values="0;444" dur="2.2s" begin=".2s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"/>
      </rect>
    </g>

    <rect x="20" y="500" width="500" height="40" fill="#0B0B10" opacity=".85"/>
    <text x="48" y="524" font-size="12" fill="#5E5E6A">Crafted by <tspan font-weight="800" font-size="12.5" fill="#E8CF9A">Judgmentz</tspan></text>
    <text x="492" y="524" font-size="11" fill="#5E5E6A" text-anchor="end">v1.5.2</text>
  </g>

  <rect x="20.75" y="20.75" width="498.5" height="518.5" rx="21.5" fill="none" stroke="url(#frame)" stroke-width="1.5"/>
</svg>
